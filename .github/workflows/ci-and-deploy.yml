name: CI and Pages Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for npx html-validator)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Ensure index.html exists
        run: |
          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html not found in repository root.";
            exit 1;
          fi
          echo "index.html found"

      - name: Run HTML validator (best-effort)
        run: |
          echo "Attempting to run html-validator via npx (best-effort)."
          # Use npx --yes to avoid prompts. This step is non-fatal by default.
          npx --yes html-validator --file=index.html --verbose || true

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to gh-pages branch (manual, no external deploy action)
        # This custom step performs a direct git push to the gh-pages branch using the
        # built-in GITHUB_TOKEN. It avoids external actions that may transitively use
        # deprecated actions/upload-artifact@v3.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Preparing deploy directory"
          # Create a clean output directory and copy site files (exclude workflow files and .git)
          rm -rf out
          mkdir out
          shopt -s dotglob || true
          # Copy everything except .github and .git
          for f in * .*; do
            case "$f" in
              .|..|.git|.github) continue ;;
              *) cp -R "$f" out/ || true ;;
            esac
          done

          cd out
          # Initialize a new repo to avoid history issues and create gh-pages branch
          git init
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy site: ${GITHUB_SHA}"

          echo "Pushing to gh-pages branch"
          # Use the token to push. The x-access-token username avoids exposing actor name.
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages

