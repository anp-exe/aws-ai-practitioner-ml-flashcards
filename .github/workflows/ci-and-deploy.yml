name: CI and Pages Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for npx html-validator)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Ensure index.html exists
        run: |
          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html not found in repository root.";
            exit 1;
          fi
          echo "index.html found"

      - name: Run HTML validator (best-effort)
        run: |
          echo "Attempting to run html-validator via npx (best-effort)."
          # Use npx --yes to avoid prompts. This step is non-fatal by default.
          npx --yes html-validator --file=index.html --verbose || true

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages via gh-pages branch
        # Using an alternative deploy action to avoid workflows that pull in the deprecated
        # actions/upload-artifact@v3. This action will push the site to the `gh-pages` branch.
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # The branch the action will deploy to. GitHub Pages can be configured to serve from this branch.
          branch: gh-pages
          # The folder to publish (repository root). Change to `docs/` or build output if needed.
          folder: ./
          clean: true

